[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.9",
    "djangorestframework>=3.16.1",
    "python-dotenv>=1.2.1",
    "psycopg2-binary",
    "drf-spectacular[sidecar]>=0.29.0",
    "django-filter>=25.2",
    "pytest>=9.0.1",
    "pytest-django>=4.11.1",
    "ruff>=0.14.8",
    "black>=25.11.0",
    "isort>=7.0.0",
    "mypy>=1.19.0",
    "flake8>=7.3.0",
]
[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "B", "D", "Q"]
ignore = ["E501"]
target-version = "py310"
